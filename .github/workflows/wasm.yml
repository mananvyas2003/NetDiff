# Build libnetdiff → WASM and publish demo artifacts (T2.5).

name: wasm

on:
  push:
    paths:
      - "engine/**"
      - "bindings/wasm/**"
      - "web/demo/**"
      - "CMakeLists.txt"
      - ".github/workflows/wasm.yml"
  pull_request:
    paths:
      - "engine/**"
      - "bindings/wasm/**"
      - "web/demo/**"
      - "CMakeLists.txt"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Configure & build
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --target netdiff_wasm --parallel
          test -f web/demo/wasm/netdiff.js
          test -f web/demo/wasm/netdiff.wasm

      - name: Upload demo site artifact
        uses: actions/upload-artifact@v4
        with:
          name: netdiff-wasm-demo
          path: web/demo
