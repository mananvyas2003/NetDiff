name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core path portability check (T0.2)
        shell: bash
        run: bash tests/portability/check_core_path.sh

      - name: Unit / determinism tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure || ctest --test-dir build --output-on-failure

      - name: Verify binary exists (Unix)
        if: runner.os != 'Windows'
        run: test -x build/engine/netdiff_engine

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "build/engine/Release/netdiff_engine.exe",
            "build/engine/netdiff_engine.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ }
          if (-not $found) { throw "netdiff_engine.exe not found" }
          Write-Host "Found: $($found[0])"

  oracle:
    name: netlist-oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad (kicad-cli hard requirement)
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases || sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad
          command -v kicad-cli
          kicad-cli version

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run netlist oracle
        run: |
          python3 tests/oracle/run_oracle.py --netdiff build/engine/netdiff_engine
        # Missing kicad-cli must fail red (script exits 2). Never continue-on-error.

  sanitize:
    name: asan-ubsan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san --parallel
      - name: Run tests under sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Smoke BuildGraph on multi-sheet corpus entry
        run: |
          ./build-san/engine/netdiff_engine tests/corpus/complex_hierarchy/complex_hierarchy.kicad_sch > /tmp/g.json
          test -s /tmp/g.json
