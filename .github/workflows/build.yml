name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify binary exists (Unix)
        if: runner.os != 'Windows'
        run: test -x build/engine/netdiff_engine

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "build/engine/Release/netdiff_engine.exe",
            "build/engine/netdiff_engine.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ }
          if (-not $found) { throw "netdiff_engine.exe not found" }
          Write-Host "Found: $($found[0])"
