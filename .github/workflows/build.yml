name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Pin one interpreter for CMake/ctest and pip (avoids macOS PEP 668
      # Homebrew Python and Windows PATH vs CMake Python3_EXECUTABLE mismatch).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure
        shell: bash
        run: |
          PY="$(command -v python)"
          echo "Configuring with Python: $PY"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PY"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core path portability check (T0.2)
        shell: bash
        run: bash tests/portability/check_core_path.sh

      - name: Install test Python deps
        shell: bash
        run: |
          PY="$(command -v python)"
          echo "Installing jsonschema with: $PY"
          "$PY" -m pip install jsonschema
          "$PY" -c "import jsonschema; print(jsonschema.__version__)"

      - name: Unit / determinism tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify binaries exist (Unix)
        if: runner.os != 'Windows'
        run: |
          test -x build/engine/netdiff_engine
          test -x build/cli/netdiff
          build/cli/netdiff version

      - name: Verify binaries exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $engine = @(
            "build/engine/Release/netdiff_engine.exe",
            "build/engine/netdiff_engine.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $engine) { throw "netdiff_engine.exe not found" }
          $cli = @(
            "build/cli/Release/netdiff.exe",
            "build/cli/netdiff.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cli) { throw "netdiff.exe not found" }
          Write-Host "Found engine: $engine"
          Write-Host "Found cli: $cli"
          & $cli version

      - name: Package smoke (T2.1)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN=$(ls build/cli/Release/netdiff.exe build/cli/netdiff.exe 2>/dev/null | head -n 1)
            NAME=netdiff-windows-x86_64
            FMT=zip
            PY=python
          else
            BIN=build/cli/netdiff
            if [[ ! -x "$BIN" ]]; then BIN=build/cli/Release/netdiff; fi
            OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            ARCH=$(uname -m | tr '[:upper:]' '[:lower:]')
            case "$ARCH" in
              x86_64|amd64) ARCH=x86_64 ;;
              aarch64|arm64) ARCH=arm64 ;;
            esac
            case "$OS" in
              linux) NAME=netdiff-linux-$ARCH; FMT=tar.gz ;;
              darwin) NAME=netdiff-macos-$ARCH; FMT=tar.gz ;;
              *) NAME=netdiff-$OS-$ARCH; FMT=tar.gz ;;
            esac
            PY=python3
          fi
          $PY scripts/package_binary.py --binary "$BIN" --name "$NAME" --format "$FMT" --out dist-ci
          ls -la dist-ci

  oracle:
    name: netlist-oracle
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad (kicad-cli hard requirement)
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases || sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kicad
          command -v kicad-cli
          kicad-cli version

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Correctness-gate contract (structural)
        run: python3 tests/oracle/test_correctness_gate_contract.py

      - name: Run netlist oracle + correctness report
        run: |
          mkdir -p build
          python3 tests/oracle/run_oracle.py \
            --netdiff build/engine/netdiff_engine \
            --report build/oracle-correctness-report.json
        # Missing kicad-cli must fail red (script exits 2). Never continue-on-error.
        # Do not loosen comparisons on mismatch — report fails and exit 1.

      - name: Validate correctness report schema
        if: always()
        run: |
          test -f build/oracle-correctness-report.json
          python3 tests/oracle/test_correctness_gate_contract.py \
            --report build/oracle-correctness-report.json \
            --require-report-file

      - name: Upload correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-correctness-report
          path: build/oracle-correctness-report.json
          if-no-files-found: error

  sanitize:
    name: asan-ubsan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san --parallel
      - name: Run tests under sanitizers
        run: ctest --test-dir build-san --output-on-failure
      - name: Smoke BuildGraph on multi-sheet corpus entry
        run: |
          ./build-san/engine/netdiff_engine tests/corpus/complex_hierarchy/complex_hierarchy.kicad_sch > /tmp/g.json
          test -s /tmp/g.json
